name: baoandkai

services:
  postgres:
    image: postgres:17-alpine
    container_name: bbkk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbkk}
      POSTGRES_USER: ${POSTGRES_USER:-bbkk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbkk} -d ${POSTGRES_DB:-bbkk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    container_name: bbkk-app
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/auth/status').then(r=>process.exit([200,401].includes(r.status)?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-bbkk}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-bbkk}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://bbkk.980823.xyz}
      UPLOAD_DIR: /app/uploads
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-/uploads}
    volumes:
      # 时区同步：容器内日志时间与宿主机保持一致
      - /etc/localtime:/etc/localtime:ro
      # 上传目录：必须与下方 nginx 容器挂载的宿主机路径完全一致，
      # 否则 app 写入的图片 nginx 直出时看不到
      - /opt/bbkk/bbkk-runtime/uploads:/app/uploads
    ports:
      - "127.0.0.1:3001:3001"

  nginx:
    build:
      context: .
      target: nginx
    container_name: bbkk-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      # HTTPS 端口：nginx 配置监听 443，必须映射出来，否则无法 HTTPS 访问
      - "443:443"
    volumes:
      # 与 app 容器使用同一个上传目录（只读直出）
      - /opt/bbkk/bbkk-runtime/uploads:/app/uploads:ro
      # SSL 证书目录（certbot 申请的证书存放位置，按实际路径调整）
      - /opt/bbkk/certs:/etc/letsencrypt:ro

volumes:
  pg_data:
    name: baoandkai_pg_data
    external: true
